name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
      - name: Install pinned SwiftLint
        run: |
          recur_lint_dir="$RUNNER_TEMP/recur-swiftlint"
          mkdir -p "$recur_lint_dir"
          recur_lint_version=$(cat .swiftlint-version)
          curl --fail --location --retry 3 \
            "https://github.com/realm/SwiftLint/releases/download/$recur_lint_version/portable_swiftlint.zip" \
            --output "$recur_lint_dir/archive.zip"
          printf '%s  %s\n' 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0' "$recur_lint_dir/archive.zip" | shasum -a 256 -c -
          unzip -q "$recur_lint_dir/archive.zip" -d "$recur_lint_dir"
          echo "$recur_lint_dir" >> "$GITHUB_PATH"
      - name: Lint, test, render maths, and build iOS
        run: Scripts/check.sh
