<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; img-src 'none'">
<link rel="stylesheet" href="katex.min.css">
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; }
body { font: 18px/1.65 -apple-system, BlinkMacSystemFont, sans-serif; color: #222a25; }
#content { white-space: pre-wrap; overflow-wrap: anywhere; padding: 2px 0 8px; }
.katex { font-size: 1.1em; }
.katex-display { margin: 18px 0; overflow-x: auto; overflow-y: hidden; padding: 5px 0; white-space: normal; }
.katex-display > .katex { text-align: left; }
@media (prefers-color-scheme: dark) { body { color: #e5ebe6; } }
</style>
<script src="katex.min.js"></script><script src="auto-render.min.js"></script>
</head><body><div id="content" role="document"></div>
<script>
const content = document.getElementById('content');
function reportHeight() {
  if (window.webkit?.messageHandlers?.height) window.webkit.messageHandlers.height.postMessage(content.getBoundingClientRect().height);
}
window.showMath = function(payload) {
  content.textContent = payload.text;
  document.body.style.fontSize = payload.size + 'px';
  if (window.renderMathInElement) {
    renderMathInElement(content, {
      delimiters: [{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],
      throwOnError: false, strict: 'ignore', trust: false, maxExpand: 1000, maxSize: 20,
      output: 'htmlAndMathml'
    });
  }
  requestAnimationFrame(reportHeight);
  document.fonts.ready.then(reportHeight);
};
new ResizeObserver(reportHeight).observe(content);
</script></body></html>
