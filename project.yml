name: MathRecall
options:
  bundleIdPrefix: com.bharat
  deploymentTarget:
    iOS: "17.0"
packages:
  RecallCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  MathRecall:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources
      - path: App/Resources
        excludes:
          - Math
    preBuildScripts:
      - name: Strict lint
        script: '"$SRCROOT/Scripts/lint.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/App
          - $(SRCROOT)/Sources/RecallCore
          - $(SRCROOT)/Sources/RecallMath
          - $(SRCROOT)/Tests/RecallCoreTests
          - $(SRCROOT)/Tests/RecallMathTests
          - $(SRCROOT)/Tools
          - $(SRCROOT)/Scripts
          - $(SRCROOT)/Package.swift
          - $(SRCROOT)/.swift-format
          - $(SRCROOT)/.swiftlint.yml
          - $(SRCROOT)/.swiftlint-version
    dependencies:
      - package: RecallCore
      - package: RecallCore
        product: RecallMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bharat.mathrecall
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "22"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Recur
        CFBundleName: Recur
        UILaunchScreen: {}
        UIRequiresFullScreen: YES
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSSupportsOpeningDocumentsInPlace: YES
        CFBundleDocumentTypes:
          - CFBundleTypeName: Recur card file
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
schemes:
  MathRecall:
    build:
      targets:
        MathRecall: all
    run:
      config: Debug
    archive:
      config: Release
